name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint, zizmor, shellcheck and input tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.31.1
      ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint and zizmor (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl --proto =https --tlsv1.2 -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          curl --proto =https --tlsv1.2 -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz -C bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: actionlint (workflows, with shellcheck)
        run: actionlint -color
      - name: zizmor (Actions security audit, action and workflows)
        run: zizmor --offline --persona=auditor --min-severity=low .
      - name: shellcheck (scripts)
        run: shellcheck -o all scripts/*.sh test/*.sh
      - name: Input validation tests
        run: bash test/check_test.sh

  install:
    name: Install a published release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install with signature and checksum verification
        env:
          INPUT_VERSION: 0.1.0-beta.1
          INPUT_VERIFY_SIGNATURE: "true"
        run: bash scripts/install.sh
      - run: guvna version

  e2e:
    name: End to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Create real drift (no cloud account needed)
        working-directory: test/fixtures/drift
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -input=false -auto-approve
          # Change the managed file outside Terraform.
          echo "CANARY-ACTION-VALUE edited outside terraform" > managed.txt

      - name: Scan, reporting only (fail-on none)
        id: report
        uses: ./
        with:
          targets: test/fixtures/drift
          fail-on: none

      - name: Check outputs and that no value leaked
        env:
          EXIT_CODE: ${{ steps.report.outputs.exit-code }}
          DRIFT_FOUND: ${{ steps.report.outputs.drift-found }}
          FINDINGS: ${{ steps.report.outputs.findings }}
          REPORT_JSON: ${{ steps.report.outputs.report-json }}
          REPORT_MD: ${{ steps.report.outputs.report-markdown }}
        run: |
          set -euo pipefail
          test "${EXIT_CODE}" = 0
          test "${DRIFT_FOUND}" = true
          test "${FINDINGS}" -ge 1
          jq -e '.findings[] | select(.resource.address == "local_file.managed")' "${REPORT_JSON}"
          grep -q 'guvna:report' "${REPORT_MD}"
          grep -q 'guvna:report' "${GITHUB_STEP_SUMMARY}"
          for f in "${REPORT_JSON}" "${REPORT_MD}" "${GITHUB_STEP_SUMMARY}"; do
            if grep -q -e CANARY-ACTION-VALUE -e "managed by terraform" "$f"; then
              echo "::error::an attribute value leaked into $f"
              exit 1
            fi
          done

      - name: Scan as a gate (fail-on info must fail the step)
        id: gate
        continue-on-error: true
        uses: ./
        with:
          targets: test/fixtures/drift
          fail-on: info
          job-summary: "false"

      - name: Check the gate failed with exit code 2
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          EXIT_CODE: ${{ steps.gate.outputs.exit-code }}
        run: |
          test "${OUTCOME}" = failure
          test "${EXIT_CODE}" = 2
